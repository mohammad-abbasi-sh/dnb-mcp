[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnb-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for the Deutsche Nationalbibliothek catalogue (DNB SRU) — books, authors, ISBN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
dnb-mcp = "dnb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dnb_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.dnb.de site"]
